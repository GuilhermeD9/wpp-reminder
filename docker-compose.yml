services:
  wpp-reminder:
    container_name: wpp-reminder
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
    stop_grace_period: 30s

volumes:
  wwebjs_auth:
  wwebjs_cache: